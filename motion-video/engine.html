<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden;background:#050308}
  #stage{position:relative;width:1080px;height:1080px;overflow:hidden;
    font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  .layer{position:absolute;inset:0}
  /* deep base */
  #base{background:radial-gradient(circle at 50% 60%,#160f22 0%,#0a0710 55%,#050308 100%)}
  /* animated mesh gradient blobs */
  #mesh{filter:blur(0px);mix-blend-mode:screen}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.85;will-change:transform,opacity}
  #cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
  /* particle + grain canvases */
  #fx{position:absolute;inset:0;pointer-events:none}
  #grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.06}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 46%,transparent 52%,rgba(3,1,7,.55) 100%)}
  #uiframe{position:absolute;inset:26px;border:1px solid rgba(255,255,255,.06);border-radius:30px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="base"></div>
  <div id="cam">
    <div class="layer" id="mesh"></div>
    <canvas id="fx" width="1080" height="1080"></canvas>
  </div>
  <div class="layer" id="vignette"></div>
  <canvas id="grain" width="360" height="360"></canvas>
  <div id="uiframe"></div>
</div>
<script>
const stage=document.getElementById('stage');
const cam=document.getElementById('cam');
const mesh=document.getElementById('mesh');
const fx=document.getElementById('fx'); const fxc=fx.getContext('2d');
const grain=document.getElementById('grain'); const gc=grain.getContext('2d');

const DUR=18;
const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// seeded pseudo-random for deterministic particles
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// build mesh blobs
const blobColors=['#7c4dea','#b154e8','#5b8cff','#e15fae','#6d35e8'];
const blobs=blobColors.map((c,i)=>{const b=document.createElement('div');b.className='blob';
  b.style.background=c;b.style.width=(520+i*70)+'px';b.style.height=(520+i*70)+'px';mesh.appendChild(b);return b;});

function renderMesh(t){
  blobs.forEach((b,i)=>{
    const sp=0.06+i*0.017, ph=i*1.7;
    const cx=540+Math.cos(t*sp*TAU+ph)*(240+i*22);
    const cy=560+Math.sin(t*sp*TAU*0.8+ph*1.3)*(210+i*20);
    const sc=0.9+0.18*Math.sin(t*0.1*TAU+ph);
    b.style.left=(cx-(260+i*35))+'px';
    b.style.top=(cy-(260+i*35))+'px';
    b.style.transform=`scale(${sc})`;
    b.style.opacity=0.55+0.25*Math.sin(t*0.13*TAU+ph);
  });
}

// deterministic particle field (drifting dust + glints)
const N=90;
function renderFX(t){
  fxc.clearRect(0,0,1080,1080);
  for(let i=0;i<N;i++){
    const seedx=rnd(i), seedy=rnd(i+99), seeds=rnd(i+7);
    const drift=(t*(0.008+seeds*0.02));
    let x=((seedx+drift)%1)*1080;
    let y=((seedy + t*(0.004+seeds*0.01))%1)*1080;
    const r=0.6+seeds*2.2;
    const tw=0.35+0.65*Math.abs(Math.sin(t*(0.5+seeds)*TAU*0.2+i));
    fxc.beginPath();
    fxc.arc(x,y,r,0,TAU);
    fxc.fillStyle=`rgba(${200+seeds*55|0},${180+seedx*60|0},255,${0.15+tw*0.35})`;
    fxc.fill();
  }
}

// film grain (regenerate a small noise tile deterministically per frame)
let grainImg=gc.createImageData(360,360);
function renderGrain(t){
  const d=grainImg.data; const base=Math.floor(t*60);
  for(let i=0;i<d.length;i+=4){
    const v=(rnd((i>>2)+base*13.13)*255)|0;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  gc.putImageData(grainImg,0,0);
}

function renderCamera(t){
  // slow continuous push-in + tiny drift (image-independent baseline)
  const z=lerp(1.0,1.06,easeInOut(prog(t,0,DUR)));
  const px=Math.sin(t*0.08*TAU)*6, py=Math.cos(t*0.06*TAU)*5;
  cam.style.transform=`translate(${px}px,${py}px) scale(${z})`;
}

function render(t){
  renderCamera(t);
  renderMesh(t);
  renderFX(t);
  renderGrain(t);
}
window.__render=render; window.__DUR=DUR;
render(0);
</script>
</body>
</html>
